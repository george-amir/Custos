# Custos v0.4 Example Configuration

[daemon]
bouncer_listen = "127.0.0.1:8085"
decisions_file = "decisions.jsonl"
default_ban_ttl_secs = 3600
# Keep existing bans/signatures enforced while allowing unbanned clients at ledger capacity.
# Choose "fail_closed" for the strict HTTP 503 policy. Other admission limits still apply.
on_decision_capacity = "enforce_existing"
# Bearer token required for mutating API endpoints (POST/DELETE /v1/decisions).
# Empty disables admin mutations (503); read-only bouncer checks remain available.
# Can also be set via CUSTOS_API_TOKEN environment variable
api_token = ""
# Embedded middleware only: exact socket peers permitted to supply forwarded IPs.
# Forwarding headers from other peers are ignored.
trusted_proxies = []

[[logs]]
path = "tests/fixtures/sample_access.log"
format = "nginx_combined"

# Native Traefik / Dokploy and Caddy access logs use format = "json".
# For a Dokploy host, replace the source above with:
# [[logs]]
# path = "/etc/dokploy/traefik/dynamic/access.log"
# format = "json"

[window]
# Sliding behavioral window duration in seconds per IP
window_secs = 15
# Flush check interval in milliseconds
flush_interval_ms = 2500
# Total requests per IP window, including assets. Default action is a short HTTP throttle.
l1_flood_threshold = 120
# "ban" explicitly restores the old volume-only durable/kernel ban behavior.
flood_action = "throttle"
# Short monotonic HTTP-only cooldown; valid range 1..60 seconds. Never sent to the Hub.
throttle_secs = 5
# Exact POST authentication paths. Empty disables status-only credential-stuffing bans.
# Configure only real login routes; resource 401/403 errors never count as login failures.
auth_paths = []
# Minimum 3; default 10. A successful configured auth request suppresses this window's auth conviction.
auth_failure_threshold = 10
# Minimum suspicion score required to promote an IP window to Jev L2 analysis
min_suspicion_score = 2
# Maximum sample requests retained per IP window for Jev state compaction
max_sample_requests = 10
# Hard cap on concurrently tracked IP windows in memory to prevent spoofed-IP DDoS OOM
max_tracked_ips = 50000
# Conservative active + expired window reservation budget (64 MiB).
# Effective IP capacity is also limited by this budget and configured evidence limits.
max_state_bytes = 67108864

[jev]
endpoint = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
# Can also be set via TYPESAFE_API_KEY environment variable
api_key = ""
# Maximum suspicious IP actors packed into a single Jev /v1/systemone request
max_actors_per_batch = 25
# Minimum calibrated noul probability (0.0 - 1.0) required to issue a ban
noul_ban_threshold = 0.80
# Minimum choice confidence (0.0 - 1.0) required to accept threat classification
choice_confidence_threshold = 0.70
# Minimum confidence to cache an attack signature for L1 zero-token blocking
auto_signature_confidence_threshold = 0.92
# HTTP request timeout in milliseconds
timeout_ms = 5000

[firewall]
# Enable OS-level packet filtering bouncer alongside the HTTP Bouncer API
enabled = true
# Cross-platform backend: "auto" | "nftables" | "ipset" | "pf" | "windows_netsh"
# ("auto" selects nftables on Linux, pf on macOS/BSD, and windows_netsh on Windows)
backend = "auto"
# When true, records & logs the exact OS firewall commands without requiring root/sudo.
# Set to false (or pass --firewall-live) when running with root/Administrator privileges.
dry_run = true
table_name = "custos_block"

[hub]
# Enable gRPC Threat-Intelligence Hub synchronization (tonic HTTP/2 streaming)
enabled = false
endpoint = "http://127.0.0.1:50051"
listen = "127.0.0.1:50051"
node_id = "custos-node-1"
# Node credential (or CUSTOS_HUB_TOKEN env); Hub server requires credentials.
# A server-side shared token counts as one identity, regardless of node_id.
api_token = ""
# Minimum distinct reporting nodes required to promote an IP or signature globally
# (1 = trusted private fleet, 3+ = untrusted community quorum)
quorum_min_nodes = 1

# Hub server only: use distinct credentials for independent quorum votes.
# [hub.node_tokens]
# edge_eu = "replace-with-unique-secret"
# edge_us = "replace-with-another-unique-secret"

# Retained library state and ingestion admission limits. Not a process RSS limit.
[memory]
# Active bans AND pending cleanup share these slots. Existing entries are never evicted.
max_decisions = 10000
# A conservative 12 KiB reservation covers every queued/running event or HTTP permit.
event_queue_bytes = 8388608
event_queue_capacity = 1024
max_provider_response_bytes = 262144
hub_max_entries = 10000
max_signatures = 1024
hub_retention_secs = 3600
hub_max_streams = 16

# Analysis evidence only; durable bans and cleanup are never evicted by these caps.
max_pending_actors = 4096
max_pending_bytes = 16777216
# Monotonic age since latest local observation, including time in a window (1..86400).
analysis_ttl_secs = 300
analysis_retry_secs = 1
analysis_batches_per_flush = 16
# Candidate sub-budgets stay inside hub_max_entries/max_signatures.
hub_max_pending_entries = 2500
hub_max_pending_signatures = 256
# Effective reporter quota is also capped at half its candidate budget, rounded up.
hub_max_pending_per_node = 1000
hub_vote_ttl_secs = 60
