name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Rust Test & Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run unit & integration tests (zero-protoc pure Rust build)
        run: cargo test --all-targets
      - name: Exercise Windows SCM startup and graceful stop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-service-smoke.ps1

  minimum-rust:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  docker:
    name: Container build and isolated enforcement smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t custos:ci .
      - run: ./.github/scripts/docker-smoke.sh
      - name: Verify native expiry, batch cleanup, and availability at saturation
        run: python3 .github/scripts/docker-capacity-smoke.py
      - name: Verify Nginx allows, throttles, bans, and forwards original methods
        run: python3 .github/scripts/docker-proxy-smoke.py
      - name: Verify native Traefik v3 and v2 JSON access logs
        run: |
          python3 .github/scripts/docker-traefik-smoke.py
          CUSTOS_TRAEFIK_IMAGE=traefik:v2.10 python3 .github/scripts/docker-traefik-smoke.py
