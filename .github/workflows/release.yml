name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        default: "v0.5.0"
      intel_only:
        description: "Resume only Intel macOS assets for an existing draft release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Recovery still passes the full ten-asset/digest check before publication.
        include: ${{ fromJSON(inputs.intel_only && '[{"os":"macos-15-intel","target":"x86_64-apple-darwin","archive":"tar.gz"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","archive":"tar.gz"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","archive":"tar.gz"},{"os":"macos-latest","target":"aarch64-apple-darwin","archive":"tar.gz"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","archive":"tar.gz"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","archive":"zip"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      - name: Verify tag matches the package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python .github/scripts/prepare-release.py "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix tar.gz archive
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/custos dist/
          cp target/${{ matrix.target }}/release/custos custos-${{ matrix.target }}
          cp config.example.toml README.md LICENSE dist/
          tar -C dist -czf custos-${{ matrix.target }}.tar.gz custos config.example.toml README.md LICENSE

      - name: Package Windows zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/custos.exe dist/
          Copy-Item target/${{ matrix.target }}/release/custos.exe custos-${{ matrix.target }}.exe
          Copy-Item config.example.toml, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath custos-${{ matrix.target }}.zip

      - name: Upload release asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            custos-${{ matrix.target }}.${{ matrix.archive }}
            custos-${{ matrix.target }}${{ matrix.archive == 'zip' && '.exe' || '' }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish complete release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      - name: Require successful CI for this exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          CI_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$CI_RUN"
          gh run watch "$CI_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - name: Verify complete assets and publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'custos-*' --dir dist
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-metadata.json
          python3 .github/scripts/prepare-release.py "$RELEASE_TAG" dist release-metadata.json
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish after every platform asset is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
